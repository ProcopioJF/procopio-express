services:
  - type: web
    name: procopio-express-api
    runtime: node
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run backend:build
    startCommand: npx prisma migrate deploy --schema backend/prisma/schema.prisma && node backend/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ROUTING_API_URL
        value: ""
      - key: PER_KM_PRICING_ENABLED
        value: "false"
